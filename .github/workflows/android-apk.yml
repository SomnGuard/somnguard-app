
name: Build and Deploy SomnGuard APK

on:
  push:
    branches:
      - main
    paths:
      - 'SomnGuard-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_API_URL: https://api.somnguard.tech

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SomnGuard-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        working-directory: SomnGuard-app
        run: npm ci

      - name: Generate Android project
        working-directory: SomnGuard-app
        run: npx expo prebuild --platform android --clean
        env:
          CI: '1'

      - name: Configure Android signing
        working-directory: SomnGuard-app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/somnguard-upload-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          pattern = re.compile(
              r"(    signingConfigs \{\n        debug \{.*?\n        \}\n)"
              r"(    \}\n    buildTypes \{)",
              re.DOTALL,
          )

          match = pattern.search(text)
          if not match:
              raise SystemExit("Could not locate Android signingConfigs block")

          release_config = """        release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
          """

          text = (
              text[:match.start()]
              + match.group(1)
              + release_config
              + match.group(2)
              + text[match.end():]
          )

          start = text.index("    buildTypes {")
          end = text.find("\n    }", start)
          if end == -1:
              raise SystemExit("Could not locate buildTypes block")

          block = text[start:]
          release_start = block.find("        release {")
          if release_start == -1:
              raise SystemExit("Could not locate release build type")

          signing_line = "signingConfig signingConfigs.debug"
          position = block.find(signing_line, release_start)
          if position == -1:
              raise SystemExit("Could not locate release debug signing")

          block = (
              block[:position]
              + "signingConfig signingConfigs.release"
              + block[position + len(signing_line):]
          )

          path.write_text(text[:start] + block)
          print("Release signing configured.")
          PY

      - name: Build APK
        working-directory: SomnGuard-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SomnGuard-android-apk
          path: SomnGuard-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Deploy APK to VPS
        if: github.ref == 'refs/heads/main'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            SomnGuard-app/android/app/build/outputs/apk/release/app-release.apk \
            "$VPS_USER@$VPS_HOST:/home/somnguard/somnguard/deploy/download/www/SomnGuard.apk"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "test -s /home/somnguard/somnguard/deploy/download/www/SomnGuard.apk"

      - name: Verify public download
        if: github.ref == 'refs/heads/main'
        run: |
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 \
            --output /dev/null \
            --write-out 'Download URL HTTP %{http_code}\n' \
            https://download.somnguard.tech/SomnGuard.apk
